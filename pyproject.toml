[project]
name = "agent-labs"
version = "0.1.0"
description = "LLM 에이전트 실습"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.3",       
    "openai>=2.20",
    "python-dotenv>=1.0",   
    "pyyaml>=6.0",          
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "jsonschema>=4.0",
]
langgraph = [
    "langgraph>=1.2",
]
frameworks = [
    "mcp>=2.3",
    "claude-agent-sdk>=0.2.174",
    "openai-agents>=0.24",
    "ag2[openai]>=1.2",
    "a2a-sdk[http-server]>=1.3",
    "uvicorn>=0.30",
]
components = [
    "mem0ai>=2.2",
    "fastembed>=0.9",
    "llama-index-core>=0.14",
    "llama-index-embeddings-fastembed>=0.7",
    "langfuse>=5.0",
    "langsmith>=0.14",
    "deepeval>=4.3",
    "e2b-code-interpreter>=2.11",
    "dspy>=3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_labs"] # src 레이아웃
